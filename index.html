<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./css/style.css">

       <title>Social Links Profile</title>
</head>
<body>

    <main class="main-container">

         <section class="profile-container">
             <img class="profile-pic" src="./images/avatar-jessica.jpeg" alt="picture of Jessica Randall">
         </section>

         <section class="name-container">
         <h1 class="name">Jessica Randall</h1>
         <h2 class="location">London, United Kingdom</h2>
         </section>

         <section class="bio-container">
            <h2 class="bio">"Front-end developer and avid reader."</h2>
         </section>

          <section class="links-container">

            <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="link-button">
                    <span class="button-title">GitHub</span>
            </a>

            <a href="https://www.frontendmentor.io/" target="_blank" rel="noopener noreferrer" class="link-button">
                    <span class="button-title">Frontend Mentor</span>
            </a>

            <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" class="link-button">
                    <span class="button-title">LinkedIn</span>
            </a>

            <a href="https://x.com/" target="_blank" rel="noopener noreferrer" class="link-button">
                    <span class="button-title">X</span>
            </a>

            <a href="https://www.instagram.com/?hl=en" target="_blank" rel="noopener noreferrer" class="link-button">
                    <span class="button-title">Instagram</span>
            </a>            
          </section>


    </main>
    
</body>
</html>
