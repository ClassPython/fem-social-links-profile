<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./css/style.css">

       <title>Social Links Profile</title>
</head>
<!-- 375 x 812 -->
<body>

    <!-- 327 x 579 -->
    <main class="main-container">

        <!-- img  profile pic-->
         <!-- image fill 100% -->
         <section class="profile-container">
             <img class="profile-pic" src="./images/avatar-jessica.jpeg" alt="picture of Jessica Randall">
         </section>


         <!-- 279 x 61 -->
        <!-- name container -->
         <section class="name-container">
         <h1 class="name">Jessica Randall</h1>
         <h2 class="location">London, United Kingdom</h2>
         </section>

         <!-- 279 x 21 -->
        <!-- bio container -->
         <section class="bio-container">
            <h2 class="bio">"Front-end developer and avid reader."</h2>
         </section>

         <!-- 279 x 289 -->
        <!-- links container -->
         <!-- reusable tabs inside of links container -->
          <section class="links-container">

            <!-- 304 x 45 -->
            <button class="link-button"><h2 class="button-text">GitHub</h2></button>
            <button class="link-button"><h2 class="button-text">Frontend Mentor</h2></button>
            <button class="link-button"><h2 class="button-text">LinkedIn</h2></button>
            <button class="link-button"><h2 class="button-text">Twitter</h2></button>
            <button class="link-button"><h2 class="button-text">Instagram</h2></button>

          </section>


    </main>
    
</body>
</html>
